name: Build & Release Flutter APK

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

permissions:
  contents: write
  checks: write

jobs:
  analyze-and-test:
    name: Analyze + Test
    runs-on: ubuntu-latest
    outputs:
      had_changes: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Flutter 3.24.0
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.0'
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: flutter pub get
        run: flutter pub get

      - name: Verify MainActivity package matches namespace
        run: |
          set -e
          NAMESPACE=$(grep -E '^\s*namespace\s*=' android/app/build.gradle | head -1 | sed -E 's/.*=\s*"([^"]+)".*/\1/')
          echo "namespace=$NAMESPACE"
          EXPECTED_PATH=$(echo "$NAMESPACE" | tr '.' '/')
          EXPECTED_FILE="android/app/src/main/kotlin/$EXPECTED_PATH/MainActivity.kt"
          echo "expected: $EXPECTED_FILE"
          if [ ! -f "$EXPECTED_FILE" ]; then
            echo "FAIL: $EXPECTED_FILE not found"
            ls android/app/src/main/kotlin -R || true
            exit 1
          fi
          DECLARED=$(grep -E '^package ' "$EXPECTED_FILE" | head -1 | awk '{print $2}')
          echo "declared package=$DECLARED"
          if [ "$DECLARED" != "$NAMESPACE" ]; then
            echo "FAIL: package $DECLARED != namespace $NAMESPACE"
            exit 1
          fi
          echo "OK: MainActivity package matches namespace"

      - name: flutter analyze
        run: flutter analyze

      - name: dart format check
        run: dart format --set-exit-if-changed .

      - name: flutter test
        run: flutter test --test-randomize-ordering-seed random

      - name: Link check (README + docs)
        if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --exclude-path legacy-kotlin -- 'README.md' 'README.id.md' 'docs/**/*.md'
        continue-on-error: true  # Indonesian gov sites (KBBI etc.) often unreachable from GH runners

  android-emulator-smoke:
    name: Android emulator smoke test
    runs-on: ubuntu-latest
    needs: analyze-and-test
    if: needs.analyze-and-test.result == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Flutter 3.24.0
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.0'
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Verify launchable activity via aapt dump badging
        run: |
          set -e
          APK="$GITHUB_WORKSPACE/build/app/outputs/flutter-apk/app-debug.apk"
          echo "Built APK: $APK"
          test -f "$APK" || { echo "FAIL: APK not found"; exit 1; }
          $ANDROID_HOME/build-tools/34.0.0/aapt dump badging "$APK" > /tmp/badging.txt
          cat /tmp/badging.txt
          ACTIVITY=$(grep "launchable-activity" /tmp/badging.txt | sed -E "s/.*name='([^']+)'.*/\1/")
          PKG=$(grep "package:" /tmp/badging.txt | sed -E "s/.*package: name='([^']+)'.*/\1/")
          echo "launchable activity: $ACTIVITY"
          echo "package: $PKG"
          test "$ACTIVITY" = "id.realita62.lifeboard.MainActivity" || { echo "FAIL: launchable activity mismatch"; exit 1; }
          test "$PKG" = "id.realita62.lifeboard" || { echo "FAIL: package mismatch"; exit 1; }
          echo "OK: launchable activity and package match"

      - name: Run launch smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          emulator-boot-timeout: 600
          working-directory: ${{ github.workspace }}
          # Installs the pre-built APK, launches MainActivity, waits 20s,
          # asserts the focused window is our app and the logcat shows
          # no FATAL EXCEPTION / ClassNotFoundException. This proves the
          # app launches and reaches the main menu. The Flutter VM Service
          # integration_test approach times out on the slow software-GPU
          # CI runner (no KVM), so we use adb directly via a script file
          # (the action runs each script: line in a separate shell, so
          # variables don't carry over — a script file avoids that).
          script: bash $GITHUB_WORKSPACE/tool/launch_smoke_test.sh

  build-apk:
    name: Build & Release APK
    runs-on: ubuntu-latest
    needs: [analyze-and-test, android-emulator-smoke]
    if: startsWith(github.ref, 'refs/tags/v') && needs.analyze-and-test.result == 'success' && needs.android-emulator-smoke.result == 'success'
    env:
      REALITA_KEYSTORE_FILE: /tmp/realita.keystore
      REALITA_KEYSTORE_PASSWORD: ${{ secrets.REALITA_KEYSTORE_PASSWORD }}
      REALITA_KEY_ALIAS: ${{ secrets.REALITA_KEY_ALIAS }}
      REALITA_KEY_PASSWORD: ${{ secrets.REALITA_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Flutter 3.24.0
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.0'
          cache: true

      - name: Decode release keystore (if secret present)
        if: ${{ env.REALITA_KEYSTORE_PASSWORD != '' }}
        run: |
          echo "${{ secrets.REALITA_KEYSTORE_BASE64 }}" | base64 -d > $REALITA_KEYSTORE_FILE
          ls -la $REALITA_KEYSTORE_FILE

      - name: flutter pub get
        run: flutter pub get

      - name: flutter build apk --release --split-per-abi
        run: flutter build apk --release --split-per-abi

      - name: flutter build apk --release (universal)
        run: flutter build apk --release

      - name: Verify APK launchable activity
        run: |
          set -e
          APK=$(find build/app/outputs/flutter-apk -name "app-release.apk" | head -1)
          echo "Built APK: $APK"
          $ANDROID_HOME/build-tools/34.0.0/aapt dump badging "$APK" > /tmp/badging.txt
          cat /tmp/badging.txt
          ACTIVITY=$(grep "launchable-activity" /tmp/badging.txt | sed -E "s/.*name='([^']+)'.*/\1/")
          echo "launchable activity: $ACTIVITY"
          if [ "$ACTIVITY" != "id.realita62.lifeboard.MainActivity" ]; then
            echo "FAIL: expected launchable activity id.realita62.lifeboard.MainActivity but got $ACTIVITY"
            exit 1
          fi
          PKG=$(grep "package:" /tmp/badging.txt | sed -E "s/.*package: name='([^']+)'.*/\1/")
          echo "package: $PKG"
          if [ "$PKG" != "id.realita62.lifeboard" ]; then
            echo "FAIL: expected package id.realita62.lifeboard but got $PKG"
            exit 1
          fi
          echo "OK: launchable activity and package match"

      - name: Get version from tag (strip leading 'v')
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Rename release assets to Realita62-LifeBoard-v<VERSION>-*
        run: |
          set -e
          cd build/app/outputs/flutter-apk
          VERSION="${{ steps.version.outputs.VERSION }}"
          mv app-release.apk         "Realita62-LifeBoard-v${VERSION}-universal.apk"
          mv app-arm64-v8a-release.apk   "Realita62-LifeBoard-v${VERSION}-arm64-v8a.apk"
          mv app-armeabi-v7a-release.apk "Realita62-LifeBoard-v${VERSION}-armeabi-v7a.apk"
          mv app-x86_64-release.apk      "Realita62-LifeBoard-v${VERSION}-x86_64.apk"
          ls -la

      - name: Generate SHA256SUMS AFTER renaming
        run: |
          set -e
          cd build/app/outputs/flutter-apk
          VERSION="${{ steps.version.outputs.VERSION }}"
          sha256sum \
            "Realita62-LifeBoard-v${VERSION}-universal.apk" \
            "Realita62-LifeBoard-v${VERSION}-arm64-v8a.apk" \
            "Realita62-LifeBoard-v${VERSION}-armeabi-v7a.apk" \
            "Realita62-LifeBoard-v${VERSION}-x86_64.apk" \
            > "Realita62-LifeBoard-v${VERSION}-SHA256SUMS.txt"
          cat "Realita62-LifeBoard-v${VERSION}-SHA256SUMS.txt"

      - name: Fail if any old-named (app-*release*.apk) file remains
        run: |
          set -e
          cd build/app/outputs/flutter-apk
          OLD=$(find . -maxdepth 1 -name 'app-*release*.apk' | head -1 || true)
          if [ -n "$OLD" ]; then
            echo "FAIL: found old-named release asset: $OLD"
            ls -la
            exit 1
          fi
          echo "OK: no old-named release assets"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: ${{ steps.version.outputs.TAG }}
          body_path: CHANGELOG.md
          files: |
            build/app/outputs/flutter-apk/Realita62-LifeBoard-v*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
