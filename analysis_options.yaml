# Project analyzer config.
#
# v2.0.0 strategy:
# - errors are fatal (CI fails).
# - warnings are non-fatal in CI for v2.0.0; tracked for cleanup in v2.1.
# - infos (prefer_const_constructors, use_super_parameters, prefer_const_declarations)
#   are non-fatal in v2.0.0; tracked for cleanup in v2.1.

include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # Fail loudly on real errors.
    invalid_assignment: error
    missing_required_argument: error
    undefined_identifier: error
    undefined_method: error
    undefined_class: error
    uri_does_not_exist: error
    non_type_as_type_argument: error
    extends_non_class: error
    extra_positional_arguments_could_be_named: error
    argument_type_not_assignable: error
  language:
    strict-casts: false
    strict-inference: false
    strict-raw-types: false

linter:
  rules:
    # Style prefs disabled for v2.0.0 (will be re-enabled for v2.1 cleanup).
    use_super_parameters: false
    prefer_const_constructors: false
    prefer_const_declarations: false
    prefer_typing_uninitialized_variables: false
    # Critical: avoid real bugs.
    avoid_print: true
    avoid_dynamic_calls: false
    empty_statements: true
